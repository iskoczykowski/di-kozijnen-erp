<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8"/><meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>D&I Kozijnen Premium ERP</title>
<style>
:root{--bg:#f5f3ff;--card:#fff;--ink:#16122b;--muted:#706b8b;--pri:#7c3aed;--pri2:#a78bfa;--ok:#16a34a;--warn:#f59e0b;--bad:#ef4444;--line:#e8e2ff}*{box-sizing:border-box}body{margin:0;font-family:Inter,Arial,sans-serif;background:linear-gradient(135deg,#f7f2ff,#eef2ff);color:var(--ink)}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.loginbox{width:min(430px,100%);background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:28px;padding:26px;box-shadow:0 24px 70px #5b21b633}.brand{display:flex;gap:12px;align-items:center}.logo{width:46px;height:46px;border-radius:16px;background:linear-gradient(135deg,var(--pri),#ec4899);color:#fff;display:grid;place-items:center;font-weight:900}.input,select,textarea{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:14px;background:#fff;font:inherit}.btn{border:0;border-radius:14px;padding:12px 14px;background:var(--pri);color:#fff;font-weight:800;cursor:pointer}.btn.secondary{background:#ede9fe;color:#4c1d95}.btn.ghost{background:#fff;color:var(--pri);border:1px solid var(--line)}.app{display:none;min-height:100vh}.side{position:fixed;inset:0 auto 0 0;width:270px;background:#21133f;color:#fff;padding:18px;overflow:auto}.side .nav button{width:100%;display:flex;gap:11px;align-items:center;text-align:left;margin:6px 0;padding:12px;border:0;border-radius:14px;background:transparent;color:#ded7ff;font-weight:700}.side .nav button.active,.side .nav button:hover{background:#ffffff20;color:#fff}.main{margin-left:270px;padding:20px}.top{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:18px}.search{max-width:460px}.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.card{background:rgba(255,255,255,.92);border:1px solid var(--line);border-radius:24px;padding:18px;box-shadow:0 10px 35px #6d28d920}.stat b{font-size:28px}.muted{color:var(--muted);font-size:13px}.section{display:none}.section.active{display:block}.table{width:100%;border-collapse:collapse}.table th,.table td{padding:12px;border-bottom:1px solid var(--line);text-align:left}.pill{display:inline-flex;padding:6px 10px;border-radius:999px;background:#ede9fe;color:#5b21b6;font-weight:800;font-size:12px}.row{display:flex;gap:10px;flex-wrap:wrap}.two{display:grid;grid-template-columns:1fr 1fr;gap:14px}.list{display:grid;gap:10px}.item{padding:12px;border:1px solid var(--line);border-radius:16px;background:#fff}.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:8px}.day{min-height:86px;background:#fff;border:1px solid var(--line);border-radius:16px;padding:8px;font-size:12px}.mobilebar{display:none}.preview{max-width:110px;max-height:80px;border-radius:10px;margin:6px}.qr{font-family:monospace;background:#111827;color:#fff;border-radius:14px;padding:14px;display:inline-block}canvas{border:1px solid var(--line);border-radius:16px;background:#fff;width:100%;height:220px;touch-action:none}@media(max-width:900px){.side{display:none}.main{margin:0;padding:14px 14px 80px}.mobilebar{display:flex;position:fixed;left:10px;right:10px;bottom:10px;background:#21133f;border-radius:22px;padding:8px;z-index:5;overflow:auto}.mobilebar button{min-width:70px;border:0;background:transparent;color:#fff;padding:8px;border-radius:14px}.mobilebar button.active{background:#7c3aed}.grid,.two{grid-template-columns:1fr}.top{align-items:stretch;flex-direction:column}.cal{grid-template-columns:repeat(2,1fr)}}
</style></head><body>
<div id="login" class="login"><div class="loginbox"><div class="brand"><div class="logo">D&I</div><div><h2>D&I Kozijnen ERP</h2><div class="muted">Premium Demo · Login oder direkt starten</div></div></div><br><input id="email" class="input" value="admin@di-kozijnen.nl"><br><br><input id="pass" class="input" type="password" value="demo123"><br><br><button class="btn" onclick="login()">Einloggen</button> <button class="btn secondary" onclick="startDemo()">Demo starten</button><p class="muted">Demo: admin@di-kozijnen.nl / demo123</p></div></div>
<div id="app" class="app"><aside class="side"><div class="brand"><div class="logo">D&I</div><div><b>D&I Kozijnen</b><div class="muted">Premium ERP</div></div></div><br><div class="nav" id="nav"></div></aside><main class="main"><div class="top"><input class="input search" placeholder="Suche Kunden, Projekte, QR, Lager..."><div class="row"><select id="lang" onchange="setLang()"><option>DE</option><option>NL</option><option>EN</option><option>PL</option></select><button class="btn ghost">🔔 5</button><button class="btn secondary" onclick="logout()">Logout</button></div></div><div id="content"></div></main><div class="mobilebar" id="mnav"></div></div>
<script>
const modules=[['dash','🏠','Dashboard'],['kunden','👥','Kunden'],['projekte','📋','Projekte'],['angebote','💶','Angebote'],['rechnungen','🧾','Rechnungen'],['produktion','🏭','Produktion'],['montage','🚚','Montage'],['kalender','📅','Kalender'],['lager','📦','Vorrat'],['wareneingang','📥','Wareneingang'],['bestellung','🛒','Bestellliste'],['mitarbeiter','👷','Mitarbeiter'],['zeit','⏱️','Zeiterfassung'],['qr','▣','QR-Codes'],['whatsapp','💬','WhatsApp'],['ki','🤖','KI-Assistent'],['settings','⚙️','Einstellungen']];
let state=JSON.parse(localStorage.diERP||'{}'); if(!state.kunden){state={kunden:[{n:'Jansen BV',t:'+31 612345678',a:'Amsterdam',s:'Aktiv'}],projekte:[{n:'Villa Utrecht',k:'Jansen BV',status:'Produktion',preis:18500,files:[]}],lager:[{n:'Kozijn profiel 70mm',qty:240,min:80},{n:'HR++ Glas',qty:48,min:20},{n:'Scharnieren',qty:12,min:30}],mit:[{n:'Piotr',r:'Montage'},{n:'Anna',r:'Büro'},{n:'Mark',r:'Produktion'}],tasks:[{d:'Heute',t:'Montage Rotterdam',team:'Team A'}]};save()}
function save(){localStorage.diERP=JSON.stringify(state)} function login(){if(email.value&&pass.value){startDemo()}} function startDemo(){login.style.display='none';app.style.display='block';renderNav();show('dash')} function logout(){location.reload()} function setLang(){alert('Sprache gespeichert: '+lang.value+' (Demo-Texte bleiben überwiegend Deutsch)')}
function renderNav(){nav.innerHTML=mnav.innerHTML='';modules.forEach(m=>{let b=document.createElement('button');b.innerHTML=m[1]+' '+m[2];b.onclick=()=>show(m[0]);nav.appendChild(b);let mb=document.createElement('button');mb.innerHTML=m[1]+'<br><small>'+m[2].split('-')[0]+'</small>';mb.onclick=()=>show(m[0]);mnav.appendChild(mb)})}
function active(id){[...document.querySelectorAll('.nav button,.mobilebar button')].forEach(b=>b.classList.remove('active')); modules.forEach((m,i)=>{if(m[0]==id){nav.children[i]?.classList.add('active');mnav.children[i]?.classList.add('active')}})}
function show(id){active(id);let c=document.getElementById('content');let title=modules.find(m=>m[0]==id)[2];c.innerHTML='<h1>'+title+'</h1>'+views[id](); bindCanvas();}
function table(arr,cols){return '<div class="card"><table class="table"><tr>'+cols.map(x=>'<th>'+x[0]+'</th>').join('')+'</tr>'+arr.map(o=>'<tr>'+cols.map(x=>'<td>'+(x[1](o)||'')+'</td>').join('')+'</tr>').join('')+'</table></div>'}
const views={dash:()=>`<div class="grid"><div class="card stat"><div class="muted">Aktive Projekte</div><b>${state.projekte.length}</b></div><div class="card stat"><div class="muted">Lager Positionen</div><b>${state.lager.length}</b></div><div class="card stat"><div class="muted">Mitarbeiter</div><b>${state.mit.length}</b></div><div class="card stat"><div class="muted">Umsatz Demo</div><b>€84k</b></div></div><br><div class="two"><div class="card"><h3>Produktion Status</h3><p>Fensterprofile ███████░░ 70%</p><p>Glas █████░░░░ 50%</p><p>Montage ████████░ 80%</p></div><div class="card"><h3>Heute</h3>${state.tasks.map(t=>`<div class=item><b>${t.t}</b><div class=muted>${t.team}</div></div>`).join('')}</div></div>`,
kunden:()=>`<div class="card"><h3>Kunde hinzufügen</h3><div class=row><input id=kn class=input placeholder=Name style="flex:1"><input id=kt class=input placeholder=Telefon style="flex:1"><input id=ka class=input placeholder=Adresse style="flex:1"><button class=btn onclick="state.kunden.push({n:kn.value,t:kt.value,a:ka.value,s:'Neu'});save();show('kunden')">Speichern</button></div></div><br>`+table(state.kunden,[['Name',o=>o.n],['Telefon',o=>'<a href="tel:'+o.t+'">'+o.t+'</a>'],['Adresse',o=>o.a],['Status',o=>'<span class=pill>'+o.s+'</span>']]),
projekte:()=>`<div class=card><h3>Projekt anlegen</h3><div class=row><input id=pn class=input placeholder="Projekt" style="flex:1"><input id=pk class=input placeholder="Kunde" style="flex:1"><input id=pp class=input placeholder="Preis" style="flex:1"><button class=btn onclick="state.projekte.push({n:pn.value,k:pk.value,status:'Anfrage',preis:pp.value,files:[]});save();show('projekte')">Speichern</button></div></div><br><div class=list>${state.projekte.map((p,i)=>`<div class=item><b>${p.n}</b> <span class=pill>${p.status}</span><div class=muted>${p.k} · €${p.preis}</div><br><input type=file accept='image/*,.pdf' multiple onchange='addFiles(event,${i})'><input type=file accept='image/*' capture='environment' onchange='addFiles(event,${i})'><button class='btn secondary' onclick='qrProject(${i})'>QR</button><button class='btn ghost' onclick="location.href='https://wa.me/?text=Projekt%20${encodeURIComponent(p.n)}'">WhatsApp</button><div>${(p.files||[]).map(f=>f.startsWith('data:image')?`<img class=preview src='${f}'>`:`<span class=pill>📄 Datei</span>`).join('')}</div></div>`).join('')}</div>`,
angebote:()=>`<div class=card><h3>Angebote</h3><button class=btn onclick="alert('PDF-Angebot wird in echter App generiert')">PDF-Angebot erstellen</button></div>`+table(state.projekte,[['Nr',(_,i)=>'ANG-'+Math.floor(Math.random()*9999)],['Projekt',o=>o.n],['Preis',o=>'€'+o.preis],['Status',()=>'<span class=pill>Offen</span>']]),
rechnungen:()=>table(state.projekte,[['Rechnung',()=> 'INV-'+Math.floor(Math.random()*9999)],['Projekt',o=>o.n],['Betrag',o=>'€'+o.preis],['Zahlung',()=>'<span class=pill>Offen</span>']]),
produktion:()=>`<div class=two><div class=card><h3>Produktionszeichnung</h3><canvas id=draw></canvas><button class=btn onclick="alert('Zeichnung lokal gespeichert')">Zeichnung speichern</button></div><div class=card><h3>Material & Qualität</h3><textarea class=input rows=5 placeholder="Maße, Glas, Profil, Farbe..."></textarea><br><br><label><input type=checkbox> Maße geprüft</label><br><label><input type=checkbox> Glas geprüft</label><br><label><input type=checkbox> Qualität OK</label></div></div>`,
montage:()=>`<div class=card><h3>Montage planen</h3><div class=row><input class=input placeholder="Baustelle" style="flex:1"><input class=input type=date><select><option>Team A</option><option>Team B</option></select><button class=btn>Planen</button></div></div><br><div class=list>${state.tasks.map(t=>`<div class=item><b>${t.t}</b><div class=muted>${t.team}</div><button class='btn secondary'>Checkliste</button> <button class='btn ghost'>Unterschrift</button></div>`).join('')}</div>`,
kalender:()=>`<div class=cal>${Array.from({length:30},(_,i)=>`<div class=day><b>${i+1}</b><br>${i==2?'Montage':i==8?'Wareneingang':i==14?'Produktion':''}</div>`).join('')}</div>`,
lager:()=>`<div class=card><h3>Vorrat hinzufügen</h3><div class=row><input id=ln class=input placeholder=Artikel style="flex:1"><input id=lq class=input type=number placeholder=Menge><input id=lm class=input type=number placeholder=Mindestbestand><button class=btn onclick="state.lager.push({n:ln.value,qty:+lq.value,min:+lm.value});save();show('lager')">Speichern</button></div></div><br>`+table(state.lager,[['Artikel',o=>o.n],['Vorrat',o=>o.qty],['Mindestbestand',o=>o.min],['Status',o=>o.qty<o.min?'<span class=pill style="background:#fee2e2;color:#991b1b">Bestellen</span>':'<span class=pill>OK</span>']]),
wareneingang:()=>`<div class=card><h3>Wareneingang buchen</h3><div class=row><select id=wi>${state.lager.map((x,i)=>`<option value=${i}>${x.n}</option>`)}</select><input id=wq type=number class=input placeholder="Menge"><button class=btn onclick="state.lager[wi.value].qty+=+wq.value;save();show('lager')">Buchen</button></div></div>`,
bestellung:()=>table(state.lager.filter(x=>x.qty<x.min),[['Artikel',o=>o.n],['Fehlt',o=>o.min-o.qty],['Aktion',()=>'<button class="btn secondary">Bestellen</button>']]),
mitarbeiter:()=>`<div class=card><div class=row><input id=mn class=input placeholder=Name style="flex:1"><select id=mr><option>Admin</option><option>Büro</option><option>Produktion</option><option>Montage</option><option>Lager</option></select><button class=btn onclick="state.mit.push({n:mn.value,r:mr.value});save();show('mitarbeiter')">Speichern</button></div></div><br>`+table(state.mit,[['Name',o=>o.n],['Rolle',o=>'<span class=pill>'+o.r+'</span>']]),
zeit:()=>`<div class=card><h3>Zeiterfassung</h3><button class=btn>Start</button> <button class='btn secondary'>Pause</button> <button class='btn ghost'>Stop</button><p class=muted>Stundenzettel werden in echter App gespeichert.</p></div>`,
qr:()=>`<div class=card><h3>QR-Code Zugriff</h3><div class=qr>DIKOZIJNEN-${Date.now().toString().slice(-6)}</div><p>QR-Code für Projekt/Material scannen und direkt öffnen.</p><input type=file accept=image/* capture=environment><button class=btn>QR scannen</button></div>`,
whatsapp:()=>`<div class=card><h3>WhatsApp Nachricht</h3><input id=wt class=input placeholder="Telefon +316..."><br><br><textarea id=wm class=input rows=4>Hallo, Ihr Montagetermin ist bestätigt.</textarea><br><br><button class=btn onclick="location.href='https://wa.me/'+wt.value.replace('+','')+'?text='+encodeURIComponent(wm.value)">WhatsApp öffnen</button></div>`,
ki:()=>`<div class=card><h3>KI-Assistent Demo</h3><textarea class=input rows=5 placeholder="Schreibe Angebot, suche Projekt, formuliere E-Mail..."></textarea><br><br><button class=btn onclick="alert('In echter Version mit OpenAI/API verbunden')">Antwort generieren</button></div>`,
settings:()=>`<div class=card><h3>Einstellungen</h3><p>Firma, Logo, Farben, Rollen, Sprachen, PDF-Vorlagen.</p><button class=btn>Speichern</button></div>`};
function addFiles(e,i){[...e.target.files].forEach(file=>{let r=new FileReader();r.onload=()=>{state.projekte[i].files=state.projekte[i].files||[];state.projekte[i].files.push(r.result);save();show('projekte')};r.readAsDataURL(file)})}
function qrProject(i){show('qr'); setTimeout(()=>alert('QR für '+state.projekte[i].n+' erstellt'),100)}
function bindCanvas(){let c=document.getElementById('draw'); if(!c)return; let ctx=c.getContext('2d'),down=false; function pos(e){let r=c.getBoundingClientRect(),t=e.touches?e.touches[0]:e;return{x:(t.clientX-r.left)*(c.width/r.width),y:(t.clientY-r.top)*(c.height/r.height)}} c.width=c.offsetWidth*2;c.height=440;ctx.lineWidth=5;ctx.lineCap='round';['mousedown','touchstart'].forEach(ev=>c.addEventListener(ev,e=>{down=true;let p=pos(e);ctx.beginPath();ctx.moveTo(p.x,p.y)}));['mousemove','touchmove'].forEach(ev=>c.addEventListener(ev,e=>{if(!down)return;e.preventDefault();let p=pos(e);ctx.lineTo(p.x,p.y);ctx.stroke()}));['mouseup','mouseleave','touchend'].forEach(ev=>c.addEventListener(ev,()=>down=false));}
</script></body></html>
